# Blueprint de Render. Los valores con "sync: false" se cargan en el dashboard y nunca se commitean.
services:
  - type: web
    name: movilidad-backend
    runtime: docker
    plan: free
    region: oregon
    branch: main            # cada push a main dispara un deploy
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    # Los cambios solo en el servicio de recomendación no redeployan el backend.
    buildFilter:
      ignoredPaths:
        - recommendation-service/**
    envVars:
      # --- Base de datos (cargar en el dashboard) ---
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # TLS obligatorio en las bases gestionadas (TiDB, Aiven, etc.).
      # createDatabaseIfNotExist evita tener que crear la base a mano: el driver la crea
      # en la primera conexion y Flyway despues arma las tablas.
      - key: DB_PARAMS
        value: sslMode=VERIFY_IDENTITY&serverTimezone=UTC&createDatabaseIfNotExist=true

      # --- Seguridad: Login Federado (Grupo 2) ---
      # Producción ya corre en modo seguro: acepta los tokens de los dos emisores (IdP del
      # Grupo 2 y login de ciudadanos) y aplica @PreAuthorize. Todo request sin token válido
      # recibe 401, salvo los endpoints públicos. "true" (modo local) es solo para desarrollo:
      # en ese modo los tokens del IdP se rechazan, así que no volver a ponerlo acá.
      - key: SECURITY_LOCAL_ENABLED
        value: "false"

      # Ninguno es secreto, por eso van como value y no con sync: false.
      # El issuer es el string exacto que firma el IdP, no una URL alcanzable.
      - key: AUTH_JWK_SET_URI
        value: https://api.citypass-login.pp.ua/.well-known/jwks.json
      - key: AUTH_ISSUER
        value: https://idp.citypass.local
      - key: AUTH_AUDIENCE
        value: citypass-movilidad-api
      # El access token no trae email ni apellido, y el contrato de eventos del bus los exige:
      # se consultan al IdP una vez, en el alta de cada persona. Si no contesta, el alta no se
      # bloquea y la fila se completa en un request posterior.
      - key: AUTH_USER_INFO_URI
        value: https://api.citypass-login.pp.ua/me
      - key: AUTH_USER_INFO_ENABLED
        value: "true"

      # --- Login de ciudadanos ---
      # Secreto HS256 en base64url, 32 bytes o mas. Es el unico secreto real que agrega
      # este modulo, por eso va con sync: false. Generarlo con:
      #   openssl rand -base64 32 | tr '+/' '-_' | tr -d '='
      # Sin esta variable y con SECURITY_LOCAL_ENABLED=false el backend NO arranca, a
      # proposito: es preferible a firmar tokens con una clave que nadie eligio.
      - key: CITIZEN_AUTH_SECRET
        sync: false
      - key: CITIZEN_AUTH_ISSUER
        value: https://movilidad.citypass.local

      # --- CORS: dominios del frontend, separados por coma ---
      - key: CORS_ALLOWED_ORIGINS
        sync: false

      # --- Servicio de recomendación ---
      # URL de movilidad-recommendation (la asigna Render). Si falta, el backend usa el criterio de respaldo.
      - key: RECOMMENDATION_SERVICE_URL
        sync: false

      - key: SPRING_PROFILES_ACTIVE
        value: default

      # --- Bus de eventos (Grupo 1), ver docs/event-bus.md ---
      # Ambiente de pruebas del bus. Las URLs son públicas; las credenciales no.
      # Activados: EVENTBUS_CLIENT_ID / EVENTBUS_CLIENT_SECRET tienen que estar cargados en el dashboard,
      # si no el backend no arranca (falla a propósito en lugar de acumular eventos que no van a salir).
      - key: EVENTBUS_PUBLISHER_ENABLED
        value: "true"
      - key: EVENTBUS_CONSUMER_ENABLED
        value: "true"
      - key: EVENTBUS_CLIENT_ID
        sync: false
      - key: EVENTBUS_CLIENT_SECRET
        sync: false
      - key: EVENTBUS_GATEWAY_URL
        value: https://test.citypass.mrfranco.net.ar/api/v1
      - key: EVENTBUS_TOKEN_URL
        value: https://test.citypass.mrfranco.net.ar/auth/oauth/token
      - key: EVENTBUS_KAFKA_BOOTSTRAP_SERVERS
        value: test.citypass.mrfranco.net.ar:9092
      - key: EVENTBUS_KAFKA_SECURITY_PROTOCOL
        value: SASL_SSL

      # --- Estaciones Ecobici ---
      # Importa el dataset en cada arranque; saltea las existentes, así que puede quedar siempre activo.
      - key: ECOBICI_IMPORT_ENABLED
        value: "true"

  # Servicio de recomendación (Python + FastAPI + scikit-learn). Sin base de datos.
  # En el plan free se duerme sin tráfico y tarda 30-60 s en despertar.
  - type: web
    name: movilidad-recommendation
    runtime: docker
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    dockerContext: ./recommendation-service
    dockerfilePath: ./recommendation-service/Dockerfile
    healthCheckPath: /health
    # Solo se redeploya cuando cambia el servicio de recomendación.
    buildFilter:
      paths:
        - recommendation-service/**
