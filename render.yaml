# Blueprint de Render: define el servicio para no configurarlo a mano en el dashboard.
# Los valores sensibles van con "sync: false": se cargan en el dashboard y NUNCA se commitean.
services:
  - type: web
    name: movilidad-backend
    runtime: docker
    plan: free
    region: oregon
    branch: main            # cada push a main dispara un deploy
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    # Los cambios solo en el servicio de recomendación no redeployan el backend.
    buildFilter:
      ignoredPaths:
        - recommendation-service/**
    envVars:
      # --- Base de datos (cargar en el dashboard) ---
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # TLS obligatorio en las bases gestionadas (TiDB, Aiven, etc.).
      # createDatabaseIfNotExist evita tener que crear la base a mano: el driver la crea
      # en la primera conexion y Flyway despues arma las tablas.
      - key: DB_PARAMS
        value: sslMode=VERIFY_IDENTITY&serverTimezone=UTC&createDatabaseIfNotExist=true

      # --- Seguridad ---
      # true = todos los endpoints abiertos (incluidos POST y PATCH).
      # Pasar a false cuando el auth-simulator del Grupo 1 sea accesible.
      - key: SECURITY_LOCAL_ENABLED
        value: "true"

      # --- CORS: dominios del frontend, separados por coma ---
      - key: CORS_ALLOWED_ORIGINS
        sync: false

      # --- Servicio de recomendacion inteligente (MOV-042) ---
      # URL del servicio movilidad-recommendation definido mas abajo. Se carga en el dashboard
      # porque el dominio lo asigna Render al crear el servicio. Si falta o no responde, el
      # backend sigue respondiendo con el criterio de respaldo.
      - key: RECOMMENDATION_SERVICE_URL
        sync: false

      - key: SPRING_PROFILES_ACTIVE
        value: default

  # Microservicio de recomendación de estaciones (MOV-041: Python + FastAPI + scikit-learn). El modelo se
  # entrena durante el build de la imagen. Sin base de datos: recibe el snapshot de estaciones en cada request.
  # La integración con el backend (URL, timeouts, fallback) corresponde a MOV-042.
  # Limitación del plan free: se duerme sin tráfico y tarda 30-60 s en despertar.
  - type: web
    name: movilidad-recommendation
    runtime: docker
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    dockerContext: ./recommendation-service
    dockerfilePath: ./recommendation-service/Dockerfile
    healthCheckPath: /health
    # Solo se redeploya cuando cambia el servicio de recomendación.
    buildFilter:
      paths:
        - recommendation-service/**
