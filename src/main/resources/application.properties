# Server
server.port=${PORT:8080}
# Detrás del proxy de Render: sin esto Swagger arma URLs http y el navegador las bloquea.
server.forward-headers-strategy=framework

# App
spring.application.name=movilidad-backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Datasource (local por defecto; se sobreescribe con variables de entorno)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:movilidad}?${DB_PARAMS:useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Bus de eventos CityPass+ (Grupo 1). Publicar es por HTTP al gateway; consumir es leyendo su Kafka.
# Ver docs/event-bus.md. Apagado por defecto: el backend funciona sin el bus levantado.
citypass.eventbus.namespace=${EVENTBUS_NAMESPACE:com.citypass.movilidad}
citypass.eventbus.gateway-url=${EVENTBUS_GATEWAY_URL:http://localhost:8080/api/v1}
citypass.eventbus.token-url=${EVENTBUS_TOKEN_URL:http://localhost:8083/oauth/token}
# Credenciales de servicio del namespace. Nunca en el repo: se cargan como variables de entorno.
citypass.eventbus.client-id=${EVENTBUS_CLIENT_ID:}
citypass.eventbus.client-secret=${EVENTBUS_CLIENT_SECRET:}
citypass.eventbus.publisher.enabled=${EVENTBUS_PUBLISHER_ENABLED:false}
citypass.eventbus.publisher.register-event-types=${EVENTBUS_REGISTER_EVENT_TYPES:true}
citypass.eventbus.consumer.enabled=${EVENTBUS_CONSUMER_ENABLED:false}
# SASL_PLAINTEXT en local, SASL_SSL contra el bus desplegado.
citypass.eventbus.consumer.security-protocol=${EVENTBUS_KAFKA_SECURITY_PROTOCOL:SASL_PLAINTEXT}
# El gateway responde /schemas/ids/{id} igual que un Schema Registry de Confluent.
citypass.eventbus.consumer.schema-registry-url=${citypass.eventbus.gateway-url}

# Kafka (solo consumo)
spring.kafka.bootstrap-servers=${EVENTBUS_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# El broker solo acepta grupos que empiecen con el namespace.
spring.kafka.consumer.group-id=${EVENTBUS_CONSUMER_GROUP:com.citypass.movilidad.backend}
spring.kafka.consumer.auto-offset-reset=earliest
# Se confirma el offset después de procesar cada evento, nunca antes (ack-mode=record).
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# Un mensaje que no se puede deserializar se deriva al error handler en lugar de bloquear la partición.
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=io.confluent.kafka.serializers.KafkaAvroDeserializer
spring.kafka.consumer.properties.allow.auto.create.topics=false

# Seguridad: true = endpoints abiertos, false = exige JWT
security.local.enabled=${SECURITY_LOCAL_ENABLED:true}
security.jwt.jwk-set-uri=${AUTH_JWK_SET_URI:http://localhost:9000/.well-known/jwks.json}

# Búsqueda de estaciones cercanas
movilidad.stations.nearby.default-radius-meters=500
movilidad.stations.nearby.max-radius-meters=5000
movilidad.stations.nearby.default-limit=10
movilidad.stations.nearby.max-limit=50

# Servicio de recomendación. Timeouts cortos: si no responde, se usa el criterio de respaldo.
movilidad.recommendation.base-url=${RECOMMENDATION_SERVICE_URL:http://localhost:8000}
movilidad.recommendation.connect-timeout-millis=1000
movilidad.recommendation.read-timeout-millis=2000
movilidad.recommendation.candidate-radius-meters=1000
movilidad.recommendation.max-candidates=15
movilidad.recommendation.warm-up-enabled=true

# CORS (separar varios origenes con coma)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Actuator
management.endpoints.web.exposure.include=health,info

# springdoc-openapi
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Importación de estaciones Ecobici (deshabilitada por defecto)
app.dataset.ecobici.import-enabled=${ECOBICI_IMPORT_ENABLED:false}
app.dataset.ecobici.location=${ECOBICI_DATASET_LOCATION:classpath:datasets/ecobici-stations.geojson}
