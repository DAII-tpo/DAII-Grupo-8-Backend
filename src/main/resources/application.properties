# Server
server.port=${PORT:8080}
# Detrás del proxy de Render: sin esto Swagger arma URLs http y el navegador las bloquea.
server.forward-headers-strategy=framework

# App
spring.application.name=movilidad-backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Datasource (local por defecto; se sobreescribe con variables de entorno)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:movilidad}?${DB_PARAMS:useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Bus de eventos CityPass+ (Grupo 1). Publicar es por HTTP al gateway; consumir es leyendo su Kafka.
# Ver docs/event-bus.md. Apagado por defecto: el backend funciona sin el bus levantado.
citypass.eventbus.namespace=${EVENTBUS_NAMESPACE:com.citypass.movilidad}
citypass.eventbus.gateway-url=${EVENTBUS_GATEWAY_URL:http://localhost:8080/api/v1}
citypass.eventbus.token-url=${EVENTBUS_TOKEN_URL:http://localhost:8083/oauth/token}
# Credenciales de servicio del namespace. Nunca en el repo: se cargan como variables de entorno.
citypass.eventbus.client-id=${EVENTBUS_CLIENT_ID:}
citypass.eventbus.client-secret=${EVENTBUS_CLIENT_SECRET:}
citypass.eventbus.publisher.enabled=${EVENTBUS_PUBLISHER_ENABLED:false}
citypass.eventbus.publisher.register-event-types=${EVENTBUS_REGISTER_EVENT_TYPES:true}
citypass.eventbus.consumer.enabled=${EVENTBUS_CONSUMER_ENABLED:false}
# SASL_PLAINTEXT en local, SASL_SSL contra el bus desplegado.
citypass.eventbus.consumer.security-protocol=${EVENTBUS_KAFKA_SECURITY_PROTOCOL:SASL_PLAINTEXT}
# El gateway responde /schemas/ids/{id} igual que un Schema Registry de Confluent.
citypass.eventbus.consumer.schema-registry-url=${citypass.eventbus.gateway-url}

# Kafka (solo consumo)
spring.kafka.bootstrap-servers=${EVENTBUS_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# El broker solo acepta grupos que empiecen con el namespace.
spring.kafka.consumer.group-id=${EVENTBUS_CONSUMER_GROUP:com.citypass.movilidad.backend}
spring.kafka.consumer.auto-offset-reset=earliest
# Se confirma el offset después de procesar cada evento, nunca antes (ack-mode=record).
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# Un mensaje que no se puede deserializar se deriva al error handler en lugar de bloquear la partición.
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=io.confluent.kafka.serializers.KafkaAvroDeserializer
spring.kafka.consumer.properties.allow.auto.create.topics=false

# Seguridad: true = endpoints abiertos, false = exige JWT del Login Federado (Grupo 2)
security.local.enabled=${SECURITY_LOCAL_ENABLED:true}

# --- Login Federado (CityPass+, Grupo 2) ---
# issuer NO es la URL del servicio: es el string exacto que firma el IdP y no resuelve por DNS,
# así que el discovery OIDC es imposible y el JWKS va configurado a mano.
movilidad.auth.jwk-set-uri=${AUTH_JWK_SET_URI:https://api.citypass-login.pp.ua/.well-known/jwks.json}
movilidad.auth.issuer=${AUTH_ISSUER:https://idp.citypass.local}
movilidad.auth.audience=${AUTH_AUDIENCE:citypass-movilidad-api}
movilidad.auth.required-token-use=${AUTH_REQUIRED_TOKEN_USE:human}

# Grupos LDAP crudos -> roles locales. Clave entre corchetes: los nombres llevan guiones y el
# relaxed binding de Boot no aplica a las claves de un Map.
movilidad.auth.group-roles[admin]=ADMIN
movilidad.auth.group-roles[delegados]=ADMIN
# Personal tecnico: se listan para documentar que existen en el directorio y que a proposito no
# reciben rol elevado. Antes apuntaban a OPERATOR, un rol que ningun @PreAuthorize chequeaba.
movilidad.auth.group-roles[operadores]=USER
movilidad.auth.group-roles[inspectores]=USER
movilidad.auth.group-roles[soporte-n2]=USER
# Rol para un token con groups vacío (el IdP permite grupos vacíos).
movilidad.auth.default-role=USER
# users.role es de un solo valor: con varios grupos gana el primero de esta lista.
movilidad.auth.role-precedence=ADMIN,USER

# Lecturas públicas (sin token).
movilidad.auth.public-get-paths=/api/v1/stations/availability,/api/v1/stations/*/availability,/api/v1/stations/nearby,/api/v1/stations/recommendation
# Vacío = todo lo demás exige token federado. El IdP es solo para personal municipal: poner
# /api/v1/trips/**,/api/v1/incidents acá devuelve el acceso a los ciudadanos hasta que el
# módulo tenga su propio login.
movilidad.auth.citizen-open-paths=
# Usuario usado solo en modo local (security.local.enabled=true), donde no hay token.
movilidad.auth.local-user-id=${AUTH_LOCAL_USER_ID:1}

# --- Perfil del empleado en el IdP (Grupo 2) ---
# El access token no trae email ni apellido, y el contrato de eventos del bus los exige:
# se consultan una vez, en el alta de cada persona, y se reparan si quedaron incompletos.
movilidad.idp.user-info-uri=${AUTH_USER_INFO_URI:https://api.citypass-login.pp.ua/me}
movilidad.idp.enabled=${AUTH_USER_INFO_ENABLED:true}
movilidad.idp.connect-timeout-millis=1000
movilidad.idp.read-timeout-millis=2000
# Sin esta espera, un IdP caido implicaria una llamada fallida por cada request.
movilidad.idp.retry-cooldown=PT10M

# Búsqueda de estaciones cercanas
movilidad.stations.nearby.default-radius-meters=500
movilidad.stations.nearby.max-radius-meters=5000
movilidad.stations.nearby.default-limit=10
movilidad.stations.nearby.max-limit=50

# Servicio de recomendación. Timeouts cortos: si no responde, se usa el criterio de respaldo.
movilidad.recommendation.base-url=${RECOMMENDATION_SERVICE_URL:http://localhost:8000}
movilidad.recommendation.connect-timeout-millis=1000
movilidad.recommendation.read-timeout-millis=2000
movilidad.recommendation.candidate-radius-meters=1000
movilidad.recommendation.max-candidates=15
movilidad.recommendation.warm-up-enabled=true

# CORS (separar varios origenes con coma)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Actuator
management.endpoints.web.exposure.include=health,info

# springdoc-openapi
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Importación de estaciones Ecobici (deshabilitada por defecto)
app.dataset.ecobici.import-enabled=${ECOBICI_IMPORT_ENABLED:false}
app.dataset.ecobici.location=${ECOBICI_DATASET_LOCATION:classpath:datasets/ecobici-stations.geojson}

# Pedido de ayuda (SOS): ventana para cancelar y plazo para el cuestionario antes de avisar a Emergencias.
movilidad.emergency.cancel-window=10s
movilidad.emergency.triage-window=60s
movilidad.emergency.deadline-check-interval=5s
