# Server
server.port=${PORT:8080}
# Detrás del proxy de Render: sin esto Swagger arma URLs http y el navegador las bloquea.
server.forward-headers-strategy=framework

# App
spring.application.name=movilidad-backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Datasource (local por defecto; se sobreescribe con variables de entorno)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:movilidad}?${DB_PARAMS:useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=movilidad-backend

# Seguridad: true = endpoints abiertos, false = exige JWT del Login Federado (Grupo 2)
security.local.enabled=${SECURITY_LOCAL_ENABLED:true}

# --- Login Federado (CityPass+, Grupo 2) ---
# issuer NO es la URL del servicio: es el string exacto que firma el IdP y no resuelve por DNS,
# así que el discovery OIDC es imposible y el JWKS va configurado a mano.
movilidad.auth.jwk-set-uri=${AUTH_JWK_SET_URI:https://api.citypass-login.pp.ua/.well-known/jwks.json}
movilidad.auth.issuer=${AUTH_ISSUER:https://idp.citypass.local}
movilidad.auth.audience=${AUTH_AUDIENCE:citypass-movilidad-api}
movilidad.auth.required-token-use=${AUTH_REQUIRED_TOKEN_USE:human}

# Grupos LDAP crudos -> roles locales. Clave entre corchetes: los nombres llevan guiones y el
# relaxed binding de Boot no aplica a las claves de un Map.
movilidad.auth.group-roles[admin]=ADMIN
movilidad.auth.group-roles[delegados]=ADMIN
movilidad.auth.group-roles[operadores]=OPERATOR
movilidad.auth.group-roles[inspectores]=OPERATOR
movilidad.auth.group-roles[soporte-n2]=OPERATOR
# Rol para un token con groups vacío (el IdP permite grupos vacíos).
movilidad.auth.default-role=USER
# users.role es de un solo valor: con varios grupos gana el primero de esta lista.
movilidad.auth.role-precedence=ADMIN,OPERATOR,USER

# Lecturas públicas (sin token).
movilidad.auth.public-get-paths=/api/v1/stations/availability,/api/v1/stations/*/availability,/api/v1/stations/nearby,/api/v1/stations/recommendation
# Vacío = todo lo demás exige token federado. El IdP es solo para personal municipal: poner
# /api/v1/trips/**,/api/v1/incidents acá devuelve el acceso a los ciudadanos hasta que el
# módulo tenga su propio login.
movilidad.auth.citizen-open-paths=
# Usuario usado solo en modo local (security.local.enabled=true), donde no hay token.
movilidad.auth.local-user-id=${AUTH_LOCAL_USER_ID:1}

# Búsqueda de estaciones cercanas
movilidad.stations.nearby.default-radius-meters=500
movilidad.stations.nearby.max-radius-meters=5000
movilidad.stations.nearby.default-limit=10
movilidad.stations.nearby.max-limit=50

# Servicio de recomendación. Timeouts cortos: si no responde, se usa el criterio de respaldo.
movilidad.recommendation.base-url=${RECOMMENDATION_SERVICE_URL:http://localhost:8000}
movilidad.recommendation.connect-timeout-millis=1000
movilidad.recommendation.read-timeout-millis=2000
movilidad.recommendation.candidate-radius-meters=1000
movilidad.recommendation.max-candidates=15
movilidad.recommendation.warm-up-enabled=true

# CORS (separar varios origenes con coma)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Actuator
management.endpoints.web.exposure.include=health,info

# springdoc-openapi
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Importación de estaciones Ecobici (deshabilitada por defecto)
app.dataset.ecobici.import-enabled=${ECOBICI_IMPORT_ENABLED:false}
app.dataset.ecobici.location=${ECOBICI_DATASET_LOCATION:classpath:datasets/ecobici-stations.geojson}
