# Server
server.port=${PORT:8080}
# Detrás del proxy de Render: sin esto Swagger arma URLs http y el navegador las bloquea.
server.forward-headers-strategy=framework

# App
spring.application.name=movilidad-backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Datasource (local por defecto; se sobreescribe con variables de entorno)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:movilidad}?${DB_PARAMS:useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=movilidad-backend

# Seguridad: true = endpoints abiertos, false = exige JWT
security.local.enabled=${SECURITY_LOCAL_ENABLED:true}
security.jwt.jwk-set-uri=${AUTH_JWK_SET_URI:http://localhost:9000/.well-known/jwks.json}

# Búsqueda de estaciones cercanas
movilidad.stations.nearby.default-radius-meters=500
movilidad.stations.nearby.max-radius-meters=5000
movilidad.stations.nearby.default-limit=10
movilidad.stations.nearby.max-limit=50

# Servicio de recomendación. Timeouts cortos: si no responde, se usa el criterio de respaldo.
movilidad.recommendation.base-url=${RECOMMENDATION_SERVICE_URL:http://localhost:8000}
movilidad.recommendation.connect-timeout-millis=1000
movilidad.recommendation.read-timeout-millis=2000
movilidad.recommendation.candidate-radius-meters=1000
movilidad.recommendation.max-candidates=15
movilidad.recommendation.warm-up-enabled=true

# CORS (separar varios origenes con coma)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Actuator
management.endpoints.web.exposure.include=health,info

# springdoc-openapi
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Importación de estaciones Ecobici (deshabilitada por defecto)
app.dataset.ecobici.import-enabled=${ECOBICI_IMPORT_ENABLED:false}
app.dataset.ecobici.location=${ECOBICI_DATASET_LOCATION:classpath:datasets/ecobici-stations.geojson}
