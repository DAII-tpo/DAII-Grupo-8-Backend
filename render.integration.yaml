# Blueprint independiente. Crear un servicio NUEVO; no sincronizarlo con el de main.
# Completar los valores sync:false en Render. Ver docs/ambiente-integracion-cu-int-01.md.
services:
  - type: web
    name: movilidad-backend-cu-int-01
    runtime: docker
    plan: free
    region: oregon
    branch: feat/cu-int-01-ruta-urbana
    autoDeploy: false
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      # Base/schema de integración con un usuario limitado a esta base.
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        value: movilidad_cu_int_01
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_PARAMS
        value: sslMode=VERIFY_IDENTITY&serverTimezone=UTC
      - key: SPRING_PROFILES_ACTIVE
        value: default
      # Mismo modo demo del módulo, exclusivamente con datos de prueba.
      - key: SECURITY_LOCAL_ENABLED
        value: "true"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: RECOMMENDATION_SERVICE_URL
        sync: false
      - key: ECOBICI_IMPORT_ENABLED
        value: "true"
      # Activar ambos SOLO después de confirmar el bus, permisos y schemas con EDA.
      - key: EVENTBUS_PUBLISHER_ENABLED
        value: "false"
      - key: EVENTBUS_CONSUMER_ENABLED
        value: "false"
      - key: EVENTBUS_REGISTER_EVENT_TYPES
        value: "false"
      - key: EVENTBUS_NAMESPACE
        value: com.citypass.movilidad
      - key: EVENTBUS_CONSUMER_GROUP
        value: com.citypass.movilidad.cu-int-01.integracion
      - key: EVENTBUS_CLIENT_ID
        sync: false
      - key: EVENTBUS_CLIENT_SECRET
        sync: false
      - key: EVENTBUS_GATEWAY_URL
        sync: false
      - key: EVENTBUS_TOKEN_URL
        sync: false
      - key: EVENTBUS_KAFKA_BOOTSTRAP_SERVERS
        sync: false
      - key: EVENTBUS_KAFKA_SECURITY_PROTOCOL
        value: SASL_SSL
