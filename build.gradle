plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
    id "org.sonarqube" version "7.3.1.8318"
}

group = 'com.citypass'
version = '0.1.1'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    // Solo para el deserializador Avro del bus de eventos; no se resuelve ninguna otra dependencia desde acá.
    maven {
        url = 'https://packages.confluent.io/maven/'
        content {
            includeGroup 'io.confluent'
        }
    }
}

ext {
    testcontainersVersion = '1.21.4'
    confluentVersion = '7.9.2'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.kafka:spring-kafka'
    // Deserializador Avro con formato Confluent: es el que espera el bus de eventos (Grupo 1).
    implementation("io.confluent:kafka-avro-serializer:${confluentVersion}") {
        // Trae swagger-annotations 2.1 (javax), que pisa las anotaciones de springdoc con las que se documenta la API.
        exclude group: 'io.swagger.core.v3', module: 'swagger-annotations'
    }
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.9.0'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'
    runtimeOnly 'com.mysql:mysql-connector-j:9.7.0'

    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.46'
    annotationProcessor 'org.projectlombok:lombok:1.18.46'
    testCompileOnly 'org.projectlombok:lombok:1.18.46'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.46'

    // Mapstruct
    implementation "org.mapstruct:mapstruct:1.6.3"
    annotationProcessor "org.mapstruct:mapstruct-processor:1.6.3"
    testAnnotationProcessor "org.mapstruct:mapstruct-processor:1.6.3"

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.kafka:spring-kafka-test'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:mysql'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
    imports {
        mavenBom "org.testcontainers:testcontainers-bom:${testcontainersVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}
sonar {
    properties {
        property "sonar.projectKey", "DAII-tpo_DAII-Grupo-8-Backend"
        property "sonar.organization", "daii-tpo"
        property "sonar.coverage.exclusions", "**/model/**,**/dto/**,**/controller/**"
        property "sonar.cpd.exclusions", "**/model/**,**/dto/**"
        property "sonar.coverage.jacoco.xmlReportPaths",
                "build/reports/jacoco/test/jacocoTestReport.xml"
        // El servicio de recomendación (Python) se analiza en el mismo proyecto de Sonar.
        properties["sonar.sources"] += files("recommendation-service/app", "recommendation-service/training")
        properties["sonar.tests"] += files("recommendation-service/tests")
        property "sonar.python.version", "3.12"
        property "sonar.python.coverage.reportPaths", "recommendation-service/coverage.xml"
    }
}
