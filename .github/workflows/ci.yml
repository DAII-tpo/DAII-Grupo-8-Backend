name: Backend CI

on:
  pull_request:
    branches:
      - main

jobs:
  backend-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb

      - name: Dar permisos al Gradle Wrapper
        run: chmod +x gradlew

      - name: Compilar proyecto
        run: ./gradlew clean compileJava

      - name: Ejecutar tests
        run: ./gradlew test

      - name: Generar reporte de cobertura
        run: ./gradlew jacocoTestReport

      - name: Analizar calidad con SonarQube
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew sonar -Dsonar.token=$SONAR_TOKEN -Dsonar.qualitygate.wait=true

